name: Import BLOCKWORLD 3D source archive

on:
  push:
    branches: [main]
    paths:
      - 'BLOCKWORLD_3D_1.0.0_TRADING_FISHING_ACHIEVEMENTS_UPDATE.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate and extract the release ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import stat

          archive = Path("BLOCKWORLD_3D_1.0.0_TRADING_FISHING_ACHIEVEMENTS_UPDATE.zip")
          if not archive.is_file():
              raise SystemExit(f"Missing release archive: {archive}")
          destination = Path("game")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True)
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for info in zf.infolist():
                  member = PurePosixPath(info.filename)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not accepted: {info.filename}")
                  parts = member.parts[1:] if member.parts and member.parts[0] == "blockworld-3d" else member.parts
                  if not parts:
                      continue
                  target = destination.joinpath(*parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  if mode:
                      target.chmod(mode & 0o755)
          if not (destination / "pom.xml").is_file():
              raise SystemExit("Archive did not contain a Maven pom.xml at the project root.")
          if not (destination / "src/main/java").is_dir():
              raise SystemExit("Archive did not contain the Java source tree.")
          print("Imported verified BLOCKWORLD 3D 1.0.0 source into game/")
          PY
      - name: Attempt Maven build and tests
        id: maven
        continue-on-error: true
        working-directory: game
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "build: import BLOCKWORLD 3D 1.0.0 source tree"
          git push
