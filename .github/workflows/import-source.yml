name: Import BLOCKWORLD 3D source archive

on:
  push:
    branches: [main]
    paths:
      - 'distribution/source-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reassemble and extract source safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import base64
          import tarfile

          distribution = Path("distribution")
          parts_dir = distribution / "source-parts"
          archive = distribution / "BLOCKWORLD_3D_1.0.0_SOURCE.tar.gz"
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in sorted(parts_dir.glob("part-*.b64")))
          if not encoded:
              raise SystemExit("No source archive parts found")
          archive.write_bytes(base64.b64decode(encoded, validate=True))

          destination = Path("game")
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:gz") as tar:
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  parts = path.parts[1:] if path.parts and path.parts[0] == "blockworld-3d" else path.parts
                  if not parts or not member.isfile() and not member.isdir():
                      continue
                  target = destination.joinpath(*parts)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise SystemExit(f"Cannot read archive member: {member.name}")
                      target.write_bytes(source.read())
          print("Source archive reconstructed and extracted to game/")
          PY
      - name: Verify Maven build and tests
        continue-on-error: true
        working-directory: game
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game distribution/BLOCKWORLD_3D_1.0.0_SOURCE.tar.gz
          git rm -r --cached --ignore-unmatch distribution/source-parts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "build: import BLOCKWORLD 3D 1.0.0 source tree"
          git push
